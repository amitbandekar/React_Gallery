name: Build Android APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug and Release APKs
        run: |
          cd android
          echo "Building debug APK..."
          ./gradlew assembleDebug --no-daemon
          echo "Building release APK..."
          ./gradlew assembleRelease --no-daemon

      - name: Upload APKs as GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gallery-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 'v1.0.0'
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push APKs to apk-release branch
        run: |
          mkdir -p /tmp/apks
          cp android/app/build/outputs/apk/release/app-release.apk /tmp/apks/
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/apks/
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-release
          git rm -rf .
          cp /tmp/apks/app-release.apk ./app-release.apk
          cp /tmp/apks/app-debug.apk ./app-debug.apk
          git add app-release.apk app-debug.apk
          git commit -m "Latest Gallery APK binaries"
          git push -f origin apk-release
