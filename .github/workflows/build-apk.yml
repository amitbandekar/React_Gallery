name: Build Android APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug and Release APKs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd android
          echo "Starting assembleDebug..."
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../debug_build.log || DEBUG_FAILED=1

          if [ "$DEBUG_FAILED" = "1" ]; then
            echo "assembleDebug failed! Logging error to issue..."
            gh issue create --title "assembleDebug failure log" --body "$(tail -n 120 ../debug_build.log)" || true
            exit 1
          fi

          echo "Starting assembleRelease..."
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../release_build.log || RELEASE_FAILED=1

          if [ "$RELEASE_FAILED" = "1" ]; then
            echo "assembleRelease failed! Logging error to issue..."
            gh issue create --title "assembleRelease failure log" --body "$(tail -n 120 ../release_build.log)" || true
            exit 1
          fi

      - name: Upload APKs as GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gallery-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release with APKs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.0"
          gh release create "$TAG_NAME" \
            android/app/build/outputs/apk/release/app-release.apk \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Gallery App $TAG_NAME" \
            --notes "Automated Android APK build for Gallery App. Download and install either app-release.apk or app-debug.apk on your Android device." \
            --clobber || true
